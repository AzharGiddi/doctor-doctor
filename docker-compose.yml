services:
  db:
    image: postgres:16-alpine
    container_name: doctor-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: doctor
      POSTGRES_PASSWORD: doctor
      POSTGRES_DB: doctor_platform
    ports:
      - "5432:5432"
    volumes:
      - doctor_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor -d doctor_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  doctor_platform_pgdata:
